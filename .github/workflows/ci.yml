name: CI

# Phase 14.3 — Continuous Integration & Quality Gate. Runs the exact same
# npm scripts a developer runs locally (see root package.json / each
# workspace's package.json) — this workflow orchestrates them, it does
# not reimplement them. No job here does anything a human couldn't
# reproduce locally with `npm run <script>`.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# A newer push on the same PR/branch cancels any still-running run for
# that ref — avoids burning CI minutes on a commit nobody cares about
# anymore.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # `prisma validate`/`prisma generate` only need this to be a
  # syntactically valid connection string for docs/13-DATABASE-BLUEPRINT.md's
  # env("DATABASE_URL") reference to resolve — neither command connects
  # to a real database. The real DATABASE_URL (Neon) is a per-environment
  # secret, never checked into this repo or needed here.
  DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci_placeholder'
  # apps/web/src/config/env.ts validates this eagerly at build time
  # (fails fast on a missing/malformed value) — a real-shaped placeholder
  # is sufficient since the build never actually calls it.
  NEXT_PUBLIC_API_URL: 'http://localhost:4000'
  NEXT_PUBLIC_SITE_URL: 'http://localhost:3000'
  NEXT_PUBLIC_ADMIN_URL: 'http://localhost:3001'

jobs:
  # ---------------------------------------------------------------------
  # Fast, no-build-required checks: schema validity, types, lint, format.
  # ---------------------------------------------------------------------
  quality:
    name: Quality Gate (Prisma / Types / Lint / Format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Turbo build cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-

      # Required before type-check/lint can resolve `@prisma/client`'s
      # generated types — apps/api's own source imports from it directly.
      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace=apps/api

      - name: Validate Prisma schema
        run: npm run prisma:validate --workspace=apps/api

      - name: Type-check (all workspaces)
        run: npm run type-check

      - name: Lint (all workspaces)
        run: npm run lint

      - name: Formatting check
        run: npm run format:check

      - name: Report failure
        if: failure()
        run: |
          echo "## ❌ Quality Gate failed" >> "$GITHUB_STEP_SUMMARY"
          echo "One of: Prisma schema validation, TypeScript type-check, ESLint, or Prettier formatting failed above." >> "$GITHUB_STEP_SUMMARY"
          echo "Reproduce locally: \`npm run prisma:validate --workspace=apps/api && npm run type-check && npm run lint && npm run format:check\`." >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # Backend unit tests — apps/api's Jest suite (no live DB/Redis: every
  # spec constructs the service under test with manually-mocked
  # dependencies, confirmed across all 25 suites; nothing here needs a
  # real database connection).
  # ---------------------------------------------------------------------
  test-backend:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Phase 16: this job previously had no Turbo cache step (only
      # `quality` did) — real, mechanical CI-speed gap found while
      # verifying docs/phase15-production-readiness-report.md's "CI/CD
      # verification" item. No behavior change, only cache reuse.
      - name: Cache Turbo build cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace=apps/api

      - name: Run backend unit tests
        run: npm test --workspace=apps/api

      - name: Report failure
        if: failure()
        run: |
          echo "## ❌ Backend unit tests failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Reproduce locally: \`cd apps/api && npm test\`." >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # Backend build verification.
  # ---------------------------------------------------------------------
  build-backend:
    name: Backend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Turbo build cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace=apps/api

      - name: Build apps/api
        run: npx turbo run build --filter=@phoenix/api

      # Phase 16: build output was previously discarded at the end of the
      # job — no way to inspect or reuse a CI build without rebuilding
      # locally. Uploading it is a real, standard CI capability this
      # pipeline was missing; it is NOT a deployment step — no CD
      # workflow exists yet (see docs/phase16-production-validation-report.md's
      # CI/CD section for why building one is deliberately out of this
      # phase's scope: it requires a hosting-target decision — ECS
      # Fargate / Railway / Fly.io per docs/09-PLATFORM-ARCHITECTURE.md
      # §21 — that hasn't been made).
      - name: Upload backend build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: api-dist-${{ github.sha }}
          path: apps/api/dist
          retention-days: 7

      - name: Report failure
        if: failure()
        run: |
          echo "## ❌ Backend build failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Reproduce locally: \`cd apps/api && npm run build\`." >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # Frontend build verification. apps/admin is deliberately NOT built
  # here — Phase 14.4 formally retired it as a non-canonical, unbuilt
  # scaffold (see docs/restore-point-phase14.4.md); apps/web is the
  # platform's one authoritative frontend, including its admin surface.
  # packages/* are built implicitly via turbo's dependsOn: ["^build"] graph.
  # ---------------------------------------------------------------------
  build-frontend:
    name: Frontend Build (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Turbo build cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-

      - name: Build apps/web
        run: npx turbo run build --filter=@phoenix/web

      # Phase 16: see build-backend's identical step above for why this
      # is an artifact upload, not a deployment — no CD workflow exists.
      - name: Upload frontend build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: web-next-${{ github.sha }}
          path: apps/web/.next
          retention-days: 7

      - name: Report failure
        if: failure()
        run: |
          echo "## ❌ Frontend build failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Reproduce locally: \`cd apps/web && npm run build\`." >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # Single required status check — branch protection should point at
  # this job, not at each job individually, so adding/renaming a check
  # above never silently stops being enforced.
  # ---------------------------------------------------------------------
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [quality, test-backend, build-backend, build-frontend]
    if: always()
    steps:
      - name: All checks passed
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: echo "✅ All CI checks passed." >> "$GITHUB_STEP_SUMMARY"

      - name: Some checks failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "❌ One or more CI checks failed or were cancelled — see the failing job(s) above." >> "$GITHUB_STEP_SUMMARY"
          exit 1
